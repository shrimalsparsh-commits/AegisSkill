[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisskill"
version = "0.1.0"
description = "Local CLI security harness protecting developers from malicious AI Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AegisSkill Security Team" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "llama-cpp-python>=0.2.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
aegis = "aegisskill.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

